name: Automate add workflows & PR

on:
  workflow_dispatch:

jobs:
  fork-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch and add workflows/files
        env:
          NEW_BRANCH: add-workflows
        run: |
          set -euo pipefail
          git fetch origin --prune

          # Determine default branch from origin HEAD if available; fallback to main
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@refs/remotes/origin/@@' || true)
          if [ -z "$DEFAULT_BRANCH" ]; then
            DEFAULT_BRANCH="main"
          fi
          echo "Default branch detected: $DEFAULT_BRANCH"

          # Create new branch from origin default if available; else local create
          if git ls-remote --exit-code --heads origin "$DEFAULT_BRANCH" >/dev/null 2>&1; then
            git checkout -b "$NEW_BRANCH" "origin/$DEFAULT_BRANCH"
          elif git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git checkout -b "$NEW_BRANCH" origin/main
          else
            git checkout -b "$NEW_BRANCH"
          fi

          mkdir -p .github/workflows

          cat > .github/workflows/clone-repos.yml <<'YML'
name: Clone or Add Repositories

on:
  workflow_dispatch:

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clone script
        run: |
          chmod +x scripts/clone_repos.sh || true
          ./scripts/clone_repos.sh || true
      - name: Commit and push changes
        run: |
          git add projects || true
          git add .gitmodules || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add cloned repos" || true
            git push origin HEAD:$NEW_BRANCH || true
          fi
YML

          cat > .github/workflows/basic-ci.yml <<'YML'
name: Basic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository files
        run: |
          echo "Repository has $(ls -1 | wc -l) top-level items"
YML

          cat > README.md <<'MD'
# efix

Bu depo, efixteknoloji için toplanmış ve düzenlenmiş açık kaynak AI / ML / veri projelerinin listesini ve entegrasyon notlarını içerir.

Nasıl kullanılır:
- scripts/clone_repos.sh ile seçilen projoları projects/ dizinine klonlayabilirsiniz.

License: MIT
MD

          git add .github/workflows/clone-repos.yml .github/workflows/basic-ci.yml README.md || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add workflows and update README (gh-cli)"
            git push origin HEAD:$NEW_BRANCH
          fi

      - name: Install gh CLI (for PR creation)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates apt-transport-https gnupg lsb-release
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create PR (use GH_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # target base: adjust if your default branch is not 'main'
          BASE_BRANCH="main"
          gh pr create --title "chore: add workflows and update README" --body "Automated: add workflows and README update (created by workflow)." --base "$BASE_BRANCH" --head add-workflows --repo "${{ github.repository }}" || echo "PR may already exist or failed"
