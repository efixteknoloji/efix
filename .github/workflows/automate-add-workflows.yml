name: Automate add workflows & PR

on:
  workflow_dispatch:

jobs:
  fork-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Request/create fork
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const owner = 'efixteknoloji';
            const repo = 'efix';
            try {
              await github.rest.repos.createFork({ owner, repo });
              core.info('Fork requested/created.');
            } catch (err) {
              core.info('Create fork error (may already exist): ' + err.message);
            }

      - name: Wait for fork to be available
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const forkOwner = process.env.GITHUB_ACTOR;
            const repo = 'efix';
            for (let i = 0; i < 30; i++) {
              try {
                await github.rest.repos.get({ owner: forkOwner, repo });
                core.info('Fork is available.');
                return;
              } catch (e) {
                core.info(`Waiting for fork to be ready (${i+1})`);
                await new Promise(r => setTimeout(r, 2000));
              }
            }
            core.setFailed('Timed out waiting for fork to appear.');

      - name: Create branch on fork and add files
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const upstreamOwner = 'efixteknoloji';
            const upstreamRepo = 'efix';
            const forkOwner = process.env.GITHUB_ACTOR;
            const forkRepo = 'efix';
            const newBranch = 'add-workflows';

            // get upstream default branch SHA
            const upstream = await github.rest.repos.get({ owner: upstreamOwner, repo: upstreamRepo });
            const defaultBranch = upstream.data.default_branch || 'main';
            const ref = await github.rest.git.getRef({ owner: upstreamOwner, repo: upstreamRepo, ref: `heads/${defaultBranch}` });
            const sha = ref.data.object.sha;

            // create branch on fork (if not exists)
            try {
              await github.rest.git.createRef({ owner: forkOwner, repo: forkRepo, ref: `refs/heads/${newBranch}`, sha });
              core.info('Created branch on fork: ' + newBranch);
            } catch (err) {
              core.info('Branch creation skipped (may already exist): ' + err.message);
            }

            // files to add/update on fork branch
            const files = [
              {
                path: '.github/workflows/clone-repos.yml',
                message: 'chore: add clone-repos workflow',
                content: `name: Clone or Add Repositories

on:
  workflow_dispatch:

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clone script
        run: |
          chmod +x scripts/clone_repos.sh
          ./scripts/clone_repos.sh
      - name: Commit and push changes
        run: |
          git add projects || true
          git add .gitmodules || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add cloned repos"
            git push origin HEAD:main
          fi`
              },
              {
                path: '.github/workflows/basic-ci.yml',
                message: 'chore: add basic CI',
                content: `name: Basic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository files
        run: |
          echo "Repository has $(ls -1 | wc -l) top-level items"`
              },
              {
                path: 'README.md',
                message: 'chore: update README',
                content: `# efix

Bu depo, efixteknoloji için toplanmış ve düzenlenmiş açık kaynak AI / ML / veri projelerinin listesini ve entegrasyon notlarını içerir.

Nasıl kullanılır:

- GENERAL_REPOS.md içindeki listeden ilginizi çeken projeleri seçin.
- scripts/clone_repos.sh ile seçilen projoları projects/ dizinine klonlayabilirsiniz veya Actions workflow'u kullanarak submodule olarak ekleyebilirsiniz.

Badges:

[![Repo size](https://img.shields.io/badge/repo-empty-lightgrey)](https://github.com/efixteknoloji/efix)

Hızlı Başlangıç

- Manuel klonlama (yerelde):
  - scripts/clone_repos.sh scriptini çalıştırarak seçili repoları projects/ klasörüne indirebilirsiniz.

- GitHub Actions ile otomatik klonlama / submodule ekleme:
  - GitHub > Actions > "Clone or Add Repositories" workflow'unu manuel (Run workflow) çalıştırın.
  - Mode seçeneği: "clone" (dosya kopyalama) veya "submodule" (git submodule olarak ekleme).

CI ve Diğer

- CONTRIBUTING.md içindeki talimatlara göre katkıda bulunabilirsiniz.
- Daha gelişmiş CI eklememi isterseniz (lint/test/workflows) söyleyin.

License: MIT`
              }
            ];

            for (const f of files) {
              try {
                // if file exists on the fork branch, update it
                const existing = await github.rest.repos.getContent({ owner: forkOwner, repo: forkRepo, path: f.path, ref: newBranch });
                core.info(`Updating ${f.path} on ${newBranch}`);
                await github.rest.repos.createOrUpdateFileContents({
                  owner: forkOwner,
                  repo: forkRepo,
                  path: f.path,
                  message: f.message,
                  content: Buffer.from(f.content).toString('base64'),
                  branch: newBranch,
                  sha: existing.data.sha
                });
              } catch (err) {
                core.info(`Creating ${f.path} on ${newBranch}`);
                await github.rest.repos.createOrUpdateFileContents({
                  owner: forkOwner,
                  repo: forkRepo,
                  path: f.path,
                  message: f.message,
                  content: Buffer.from(f.content).toString('base64'),
                  branch: newBranch
                });
              }
            }

      - name: Create PR from fork to upstream
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const owner = 'efixteknoloji';
            const repo = 'efix';
            const head = `${process.env.GITHUB_ACTOR}:add-workflows`;
            const title = 'chore: add workflows and update README';
            const body = 'Automated: add workflows and README update (created by workflow).';
            try {
              const pr = await github.rest.pulls.create({ owner, repo, title, head, base: 'main', body });
              core.info('PR created: ' + pr.data.html_url);
            } catch (err) {
              core.setFailed('Failed to create PR: ' + err.message);
            }
