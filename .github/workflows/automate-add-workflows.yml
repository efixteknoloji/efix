name: Automate add workflows & PR

on:
  workflow_dispatch:

jobs:
  fork-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Debug env (non-sensitive)
        run: |
          echo "GITHUB_ACTOR=$GITHUB_ACTOR"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"

      - name: Create branch and add workflows/files
        env:
          NEW_BRANCH: add-workflows
        run: |
          set -e
          git fetch origin

          # create branch from origin/main (fallback to local if origin/main missing)
          git checkout -b "$NEW_BRANCH" origin/main || git checkout -b "$NEW_BRANCH"

          mkdir -p .github/workflows

          cat > .github/workflows/clone-repos.yml <<'YML'
name: Clone or Add Repositories

on:
  workflow_dispatch:

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clone script
        run: |
          chmod +x scripts/clone_repos.sh || true
          ./scripts/clone_repos.sh || true
      - name: Commit and push changes
        run: |
          git add projects || true
          git add .gitmodules || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add cloned repos" || true
            git push origin HEAD:$NEW_BRANCH || true
          fi
YML

          cat > .github/workflows/basic-ci.yml <<'YML'
name: Basic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository files
        run: |
          echo "Repository has $(ls -1 | wc -l) top-level items"
YML

          # safe UTF-8 Turkish README (edit as needed)
          cat > README.md <<'MD'
# efix

Bu depo, efixteknoloji için toplanmış ve düzenlenmiş açık kaynak AI / ML / veri projelerinin listesini ve entegrasyon notlarını içerir.

Nasıl kullanılır:

- GENERAL_REPOS.md içindeki listeden ilginizi çeken projeleri seçin.
- scripts/clone_repos.sh ile seçilen projoları projects/ dizinine klonlayabilirsiniz veya Actions workflow'u kullanarak submodule olarak ekleyebilirsiniz.

Badges:

[![Repo size](https://img.shields.io/badge/repo-empty-lightgrey)](https://github.com/efixteknoloji/efix)

Hızlı Başlangıç

- Manuel klonlama (yerelde):
  - scripts/clone_repos.sh scriptini çalıştırarak seçili repoları projects/ klasörüne indirebilirsiniz.

- GitHub Actions ile otomatik klonlama / submodule ekleme:
  - GitHub > Actions > "Clone or Add Repositories" workflow'unu manuel (Run workflow) çalıştırın.

CI ve Diğer

- CONTRIBUTING.md içindeki talimatlara göre katkıda bulunabilirsiniz.
- Daha gelişmiş CI eklememi isterseniz (lint/test/workflows) söyleyin.

License: MIT
MD

          git add .github/workflows/clone-repos.yml .github/workflows/basic-ci.yml README.md || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add workflows and update README (gh-cli)"
            git push origin HEAD:$NEW_BRANCH
          fi

      - name: Install gh CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | gh auth login --with-token

      - name: Create PR
        run: |
          # create PR from add-workflows into main
          gh pr create --title "chore: add workflows and update README" --body "Automated: add workflows and README update (created by workflow)." --base main --head add-workflows || echo "PR may already exist or failed"
