name: Finish automation (trigger + merge)

on:
  workflow_dispatch:

jobs:
  finish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Install prerequisites (robust)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl ca-certificates apt-transport-https gnupg lsb-release
          # Add GitHub CLI apt repo / key (official)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Verify gh & jq
        run: |
          gh --version
          jq --version

      - name: Authenticate gh (use GH_TOKEN from env)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh will automatically use GH_TOKEN from the environment for API calls
          gh auth status --hostname github.com || true

      - name: Trigger "Automate add workflows & PR" (by workflow file)
        id: trigger
        run: |
          set -euo pipefail
          WORKFLOW_FILE="automate-add-workflows.yml"
          gh workflow run "$WORKFLOW_FILE" --repo "${{ github.repository }}" || true
          sleep 3
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow="$WORKFLOW_FILE" --limit 1 --json databaseId --jq '.[0].databaseId' || echo "")
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Triggered run id: $RUN_ID"

      - name: Wait for triggered run to complete (with timeout)
        if: steps.trigger.outputs.run_id != ''
        run: |
          set -euo pipefail
          RUN_ID=${{ steps.trigger.outputs.run_id }}
          echo "Waiting for run $RUN_ID..."
          MAX_WAIT_SECONDS=600    # 10 minutes
          SLEEPT=5
          ELAPSED=0
          while true; do
            STATUS=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json status,conclusion --jq '.status + " " + (.conclusion // "")' || echo "unknown")
            echo "Status: $STATUS"
            if [[ "$STATUS" =~ ^completed ]]; then
              echo "Run completed."
              break
            fi
            if [ "$ELAPSED" -ge "$MAX_WAIT_SECONDS" ]; then
              echo "Timeout waiting for run $RUN_ID (waited $ELAPSED seconds). Exiting wait loop."
              break
            fi
            sleep $SLEEPT
            ELAPSED=$((ELAPSED + SLEEPT))
          done
          echo "Displaying run logs (best-effort):"
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --log || echo "Failed to fetch run logs"

      - name: Find add-workflows PR
        id: findpr
        run: |
          set -euo pipefail
          PR_NUM=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.repository_owner }}:add-workflows" --state open --json number --jq '.[0].number' || echo "")
          echo "pr=$PR_NUM" >> $GITHUB_OUTPUT
          echo "Found PR: $PR_NUM"

      - name: Merge PR if exists
        if: steps.findpr.outputs.pr != ''
        run: |
          set -euo pipefail
          PR=${{ steps.findpr.outputs.pr }}
          echo "Attempting to merge PR #$PR"
          if gh pr merge "$PR" --repo "${{ github.repository }}" --merge --delete-branch; then
            echo "PR #$PR merged successfully."
          else
            echo "Merge failed for PR #$PR — showing PR diagnostics:"
            gh pr view "$PR" --repo "${{ github.repository }}" --json number,title,state,mergeable,mergeableState,headRefName,baseRefName --jq '.'
            echo "If branch protection or required reviews block merging, please resolve them (or choose a different merge strategy)."
            exit 1
          fi

      - name: Done
        run: echo "Finish-up automation complete."
